services:
  mysql:
    image: mysql:8.0
    container_name: bluecore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "credit_applications_test"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: bluecore-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://root:123456@mysql:3306/credit_applications_test"
      DATABASE_HOST: "mysql"
      DATABASE_USER: "root"
      DATABASE_PASSWORD: "123456"
      DATABASE_NAME: "credit_applications_test"
      PORT: "3000"
      JWT_SECRET: "jwt_secret_key"
      JWT_EXPIRES_IN: "1h"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    container_name: bluecore-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  mysql_data: